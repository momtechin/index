<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b2c83">
<meta name="robots" content="noindex,nofollow">
<title>สารบัญเว็บ · momtechin</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%235b2c83'/%3E%3Cpath d='M36 6 16 36h14l-4 22 22-32H34z' fill='%23f6c544'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#5b2c83;--p2:#3d1a5c;--gold:#f6c544;--bg:#f5f2f8;--card:#fff;--ink:#221d29;--mute:#6f6878;--ok:#1f8a4c;--off:#9a8fa6;--line:#e6dfee}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:16px}
header{background:linear-gradient(135deg,var(--p2),var(--p));color:#fff;padding:28px 18px 64px}
.wrap{max-width:1040px;margin:0 auto}
header h1{margin:0;font-size:28px;display:flex;align-items:center;gap:10px}
header h1 .bolt{width:40px;height:40px;border-radius:10px;background:var(--gold);color:var(--p2);display:grid;place-items:center;font-size:24px}
header p{margin:6px 0 0;opacity:.85}
.search{margin:-36px auto 0;max-width:1040px;padding:0 18px}
.search input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border-radius:14px;border:1px solid var(--line);box-shadow:0 6px 20px #3d1a5c1f;outline:none}
.search input:focus{border-color:var(--p)}
main{padding:8px 18px 40px}
h2{font-size:19px;margin:26px 0 10px;color:var(--p2);display:flex;align-items:center;gap:8px}
h2 small{font-weight:400;color:var(--mute);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:8px;transition:.15s}
.card:hover{box-shadow:0 8px 24px #3d1a5c1a;transform:translateY(-2px)}
.top{display:flex;gap:12px;align-items:flex-start}
.ico{flex:none;width:46px;height:46px;border-radius:12px;background:#f0e8f7;display:grid;place-items:center;font-size:24px}
.card h3{margin:0;font-size:17px;line-height:1.35}
.card p{margin:0;color:var(--mute);font-size:14.5px;line-height:1.5}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;padding:2px 9px;border-radius:99px;background:#f0e8f7;color:var(--p2)}
.st{font-size:12.5px;padding:2px 9px;border-radius:99px;color:#fff;background:var(--ok)}
.st.off{background:var(--off)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:6px}
.btn{font:inherit;font-size:14.5px;font-weight:600;text-decoration:none;padding:8px 14px;border-radius:10px;background:var(--p);color:#fff;display:inline-flex;align-items:center;gap:6px}
.btn.sec{background:#fff;color:var(--p);border:1px solid var(--p)}
.btn.dis{background:#ece8f0;color:var(--off);pointer-events:none}
.empty{color:var(--mute);padding:20px 0;display:none}
footer{color:var(--mute);font-size:13.5px;text-align:center;padding:10px 18px 30px;line-height:1.6}
@media (max-width:520px){header h1{font-size:23px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="wrap">
  <h1><span class="bolt">⚡</span>สารบัญเว็บและระบบงาน</h1>
  <p>กฟส.บ้านแพง · Monolith · รวมลิงก์ไปยังระบบ รายงาน และ repo ทั้งหมดในที่เดียว</p>
</div></header>
<div class="search"><input id="q" type="search" placeholder="🔍 ค้นหา เช่น เวร, KPI, คฟม., ไฟฟ้าขัดข้อง" autocomplete="off"></div>
<main class="wrap" id="main"></main>
<p class="empty wrap" id="empty">ไม่พบรายการที่ค้นหา</p>
<footer>ดูแลโดย แสนดี · ปรับปรุงล่าสุด <span id="upd"></span><br>
ลิงก์ที่ขึ้น “ปิดอยู่” = repo เป็น private จึงไม่มีหน้าเว็บสาธารณะ (เปิดดูได้ใน repo เมื่อล็อกอิน GitHub)</footer>
<script>
const UPDATED = '2026-10-29';
const GH = 'https://github.com/momtechin/';
const PAGES = 'https://momtechin.github.io/';
/* live: true = เปิดใช้ได้จริงตอนนี้ / false = ปิดอยู่ (repo private) — แก้ที่นี่ที่เดียว */
const SECTIONS = [
  { title: 'ระบบใช้งานประจำวัน', note: 'เปิดในมือถือได้เลย', items: [
    { icon: '🚚', name: 'ส่งมอบเวร รถ / เครื่องมือ', desc: 'ตรวจนับอุปกรณ์ประจำรถ ห้องเครื่องมือ และอุปกรณ์ประจำกาย ตอนรับ-ส่งเวร · บันทึกเข้า Google Sheet',
      tags: ['กฟส.บ้านแพง', 'Google Apps Script', 'รายวัน'], live: true,
      web: 'https://script.google.com/macros/s/AKfycbwNgfOGts7E2aAh9KMctO1uGm9tkAo-RID6BjEieoG_4Z-YWByuFbFy6NR_oN3ZrtBUeA/exec',
      repo: 'pea-shift-handover' } ] },
  { title: 'รายงานและแดชบอร์ด', note: 'GitHub Pages', items: [
    { icon: '📊', name: 'KPIs กฟส.บ้านแพง 2569', desc: 'คะแนนตัวชี้วัดสะสม ม.ค.–ก.ย. 2569', tags: ['KPI', 'รายงาน'],
      live: false, web: PAGES + 'monolith/', repo: 'monolith' },
    { icon: '⚡', name: 'แดชบอร์ดไฟฟ้าขัดข้อง', desc: 'เหตุไฟฟ้าขัดข้อง กฟส.บ้านแพง และ กฟส.นาทม (ชื่อผู้ปฏิบัติงานแสดงเป็นจำนวนคน ตาม PDPA)',
      tags: ['ไฟฟ้าขัดข้อง', 'แดชบอร์ด', 'นาทม'], live: false, web: PAGES + 'sandy/dashboard/', repo: 'sandy' },
    { icon: '🏗️', name: 'โครงการ คฟม.3 กฟส.บ้านแพง', desc: 'ตารางรายการโครงการ คฟม.3 (ข้อมูล 17 ต.ค. 2569)', tags: ['คฟม.3', 'โครงการ'],
      live: true, web: PAGES + 'kfm3-banphaeng/', repo: 'kfm3-banphaeng' },
    { icon: '📈', name: 'KPIs กฟส.นาทม (XS) 2569', desc: 'คะแนนตัวชี้วัดสะสม ม.ค.–ก.ย. 2569 ระดับคะแนน 4.8612 อันดับ 25/73 ของ กฟฉ.1 (ที่ 1 นครพนม) พร้อมหลักฐานรายข้อ', tags: ['KPI', 'นาทม', 'รายงาน'],
      live: true, web: PAGES + 'kpi-nathom/', repo: 'kpi-nathom' } ] },
  { title: 'Repository (โค้ด)', note: 'github.com/momtechin · index, kfm3-banphaeng, kpi-nathom เป็น public นอกนั้น private', items: [
    { icon: '🧭', name: 'index', desc: 'หน้าสารบัญนี้ (public · GitHub Pages)', tags: ['สารบัญ'], repo: 'index' },
    { icon: '🚚', name: 'pea-shift-handover', desc: 'โค้ดระบบส่งมอบเวร (Apps Script + หน้าเว็บ)', tags: ['Apps Script'], repo: 'pea-shift-handover' },
    { icon: '📊', name: 'monolith', desc: 'หน้า KPIs กฟส.บ้านแพง', tags: ['KPI'], repo: 'monolith' },
    { icon: '⚡', name: 'sandy', desc: 'แดชบอร์ดไฟฟ้าขัดข้อง (โฟลเดอร์ dashboard)', tags: ['แดชบอร์ด'], repo: 'sandy' },
    { icon: '🏗️', name: 'kfm3-banphaeng', desc: 'ตารางโครงการ คฟม.3 (public · GitHub Pages)', tags: ['คฟม.3'], repo: 'kfm3-banphaeng' },
    { icon: '📈', name: 'kpi-nathom', desc: 'หน้า KPIs กฟส.นาทม (public · GitHub Pages)', tags: ['KPI'], repo: 'kpi-nathom' },
    { icon: '🤖', name: 'sonteen', desc: 'The agent that grows with you', tags: ['agent'], repo: 'sonteen' } ] }
];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function card(it) {
  const status = it.web ? `<span class="st ${it.live ? '' : 'off'}">${it.live ? '● ใช้งานได้' : '○ ปิดอยู่'}</span>` : '';
  const web = it.web ? (it.live ? `<a class="btn" href="${esc(it.web)}" target="_blank" rel="noopener">เปิด ↗</a>`
                                : `<span class="btn dis" title="repo เป็น private — ไม่มีหน้าเว็บสาธารณะ">เว็บปิดอยู่</span>`) : '';
  const repo = it.repo ? `<a class="btn sec" href="${GH + esc(it.repo)}" target="_blank" rel="noopener">Repo</a>` : '';
  return `<div class="card" data-k="${esc([it.name, it.desc, ...(it.tags || []), it.repo || ''].join(' ').toLowerCase())}">
    <div class="top"><div class="ico">${it.icon}</div><div><h3>${esc(it.name)}</h3></div></div>
    <p>${esc(it.desc)}</p>
    <div class="tags">${status}${(it.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
    <div class="btns">${web}${repo}</div></div>`;
}
document.getElementById('main').innerHTML = SECTIONS.map(s =>
  `<section><h2>${esc(s.title)} <small>${esc(s.note)}</small></h2><div class="grid">${s.items.map(card).join('')}</div></section>`).join('');
const [y, m, d] = UPDATED.split('-').map(Number);
document.getElementById('upd').textContent = `${d} ${['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'][m - 1]} ${y + 543}`;
document.getElementById('q').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase(); let n = 0;
  document.querySelectorAll('section').forEach(sec => { let v = 0;
    sec.querySelectorAll('.card').forEach(c => { const ok = !q || c.dataset.k.includes(q); c.style.display = ok ? '' : 'none'; v += ok; });
    sec.style.display = v ? '' : 'none'; n += v; });
  document.getElementById('empty').style.display = n ? 'none' : 'block';
});
</script>
</body>
</html>
